{{ define "content" }}
<h1>Вход в {{ .ClientName }}</h1>
{{ if .Error }}<div class="error" role="alert">{{ .Error }}</div>{{ end }}
<form method="post" action="/login" autocomplete="on">
  <input type="hidden" name="interaction" value="{{ .InteractionID }}">
  <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" required autocomplete="username" value="{{ .Email }}" autofocus>
  <label for="password">Пароль</label>
  <input id="password" name="password" type="password" required autocomplete="current-password">
  <button class="primary" type="submit">Войти</button>
</form>
<p class="muted">Запрашивает доступ приложение «{{ .ClientName }}». Пароль передаётся только сервису аутентификации.</p>
{{ end }}
