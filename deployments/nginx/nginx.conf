worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    log_format iam '$remote_addr - $request_id "$request" $status $body_bytes_sent '
                   '"$http_user_agent" auth_user=$upstream_http_x_user_id';
    access_log /var/log/nginx/access.log iam;

    upstream iam {
        server iam:8080;
        keepalive 32;
    }

    upstream backend {
        server backend:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # ------------------------------------------------------------------
        # Authorization server endpoints, reachable by clients.
        # ------------------------------------------------------------------
        location ~ ^/(oauth/authorize|oauth/token|oauth/userinfo|oauth/revoke|oauth/logout|oauth/end_session|login|consent|\.well-known/) {
            proxy_pass http://iam;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection "";
            proxy_read_timeout 30s;
        }

        # The verification endpoint is internal only: exposing it would let
        # anybody probe tokens from outside the cluster.
        location = /verify {
            return 404;
        }

        location = /_verify {
            internal;
            proxy_pass http://iam/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Authorization $http_authorization;
        }

        # ------------------------------------------------------------------
        # API: every request is authorised by IAM before it reaches a backend.
        # ------------------------------------------------------------------
        location /api/ {
            auth_request /_verify;
            auth_request_set $iam_user_id    $upstream_http_x_user_id;
            auth_request_set $iam_client_id  $upstream_http_x_client_id;
            auth_request_set $iam_scopes     $upstream_http_x_scopes;
            auth_request_set $iam_session_id $upstream_http_x_session_id;
            auth_request_set $iam_roles      $upstream_http_x_user_roles;
            auth_request_set $iam_auth_time  $upstream_http_x_auth_time;
            auth_request_set $iam_www_authenticate $upstream_http_www_authenticate;
            # "unavailable" means the authorization service could not decide;
            # the client gets a 503 rather than a misleading 401.
            auth_request_set $iam_auth_reason $upstream_http_x_auth_reason;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            # Identity is injected by the proxy; the client's own headers are
            # replaced so they cannot be spoofed.
            proxy_set_header X-User-ID $iam_user_id;
            proxy_set_header X-Client-ID $iam_client_id;
            proxy_set_header X-Scopes $iam_scopes;
            proxy_set_header X-Session-ID $iam_session_id;
            proxy_set_header X-User-Roles $iam_roles;
            proxy_set_header X-Auth-Time $iam_auth_time;
            proxy_set_header Authorization "";
            proxy_set_header Connection "";

            error_page 401 = @api_unauthorized;
            error_page 403 = @api_unauthorized;
            error_page 503 = @api_unavailable;
        }

        # Browser-facing area: an unauthenticated user is sent to the login page.
        location /app/ {
            auth_request /_verify;
            error_page 401 = @web_login;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection "";
        }

        location @api_unauthorized {
            default_type application/json;
            add_header WWW-Authenticate $iam_www_authenticate always;
            add_header Retry-After $upstream_http_retry_after always;

            if ($iam_auth_reason = "unavailable") {
                return 503 '{"error":"temporarily_unavailable","error_description":"authorization service is unavailable"}';
            }
            return 401 '{"error":"invalid_token","error_description":"authentication required"}';
        }

        location @web_login {
            # A bare /login has no client context; the page explains how to start
            # the flow from the application.
            return 302 /login;
        }

        # ------------------------------------------------------------------
        # Демо-клиент: статика, которая проходит OAuth-цикл в браузере.
        # Публичная зона без auth_request — это клиент, а не защищённый ресурс.
        # Монтируется только для локального стенда.
        # ------------------------------------------------------------------
        location = /demo {
            return 302 /demo/;
        }

        location /demo/ {
            root /usr/share/nginx;
            try_files $uri /demo/index.html;
            add_header Cache-Control "no-store" always;
            # Страница работает только с тем же origin: ни сторонних скриптов,
            # ни отправки данных наружу.
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'" always;
        }

        # Metrics live on the admin port only.
        location = /metrics {
            return 404;
        }

        location = /healthz {
            proxy_pass http://iam/healthz;
            proxy_set_header Host $host;
        }
    }
}
